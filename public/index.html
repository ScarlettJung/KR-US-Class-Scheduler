<!DOCTYPE html> 
<html lang="ko"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>TimeSync Scheduler</title> 
<link rel="stylesheet" href="style.css"> 
</head> 
<body> 
<header class="app-header"> 
<div class="logo-area"> 
<h2>TimeSync Scheduler</h2> 
<p>Washington D.C. 기준 스케줄러</p> 
</div> 
<button id="openModalBtn" class="primary-btn">새 수업 등록</button> 
</header> 

<div class="main-layout"> <!-- (1) 전체를 감싸는 큰 상자 --> 
  <aside class="sidebar"> <!-- (2) 왼쪽 사이드바 (보조 정보) --> 
  <!-- Sidebar with Mini Calendar --> 

    <div class="mini-calendar"> 
      <div class="mini-calendar-header"> 
        <button id="prevMonth" class="nav-btn">&lt;</button> 
        <span id="miniCalendarTitle">March 2026</span> 
        <button id="nextMonth" class="nav-btn">&gt;</button> 
      </div> 
      <div class="mini-calendar-weekdays"> 
        
<span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><sp
an>Sa</span> 
      </div> 
      <div id="miniCalendarDays" class="mini-calendar-days"> 
        <!-- Days will be generated by JavaScript --> 
      </div> 
    </div> 
  </aside> 
 <div class="schedule-area"> 
    <!-- Week Navigation --> 
    <div class="week-navigation"> 
      <button id="prevWeek" class="nav-btn">&lt;</button> 
      <span id="weekTitle">March 2 - 8, 2026</span> 
      <button id="nextWeek" class="nav-btn">&gt;</button> 
      <button id="todayBtn" class="today-btn">Today</button> 
    </div> 
 
   <!-- Weekly Schedule  --> 
    <div id="scheduleGrid" class="grid-container"> 
      <!-- Header row --> 
      <div class="grid-cell header">Time</div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Mon</div><div 
class="header-date">2</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Tue</div><div 
class="header-date">3</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Wed</div><div 
class="header-date">4</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Thu</div><div 
class="header-date">5</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Fri</div><div 
class="header-date">6</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Sat</div><div 
class="header-date">7</div></div></div> 
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Sun</div><div 
class="header-date">8</div></div></div> 
 
      <!-- 09:00 row --> 
      <div class="grid-cell time-label">09:00</div> 
      <div class="grid-cell task-cell color-yellow">윤서 (수업)</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
         <div class="grid-cell"></div> 
      <!-- 10:00 row --> 
      <div class="grid-cell time-label">10:00</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell task-cell color-blue">민준 (수업)</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell task-cell color-blue">민준 (수업)</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <!-- 11:00 row --> 
      <div class="grid-cell time-label">11:00</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell task-cell color-green">서연 (수업)</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <!-- 12:00 row --> 
      <div class="grid-cell time-label">12:00</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <!-- 13:00 row --> 
      <div class="grid-cell time-label">13:00</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell task-cell color-purple">지호 (수업)</div> 
      <div class="grid-cell"></div> 
      <div class="grid-cell"></div> 
    </div> 
  </div> 
</div> 
</div>
