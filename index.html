<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeSync Scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="logo-area">
    <h2>TimeSync Scheduler</h2>
    <p>Washington D.C. 기준 스케줄러</p>
  </div>
  <button id="openModalBtn" class="primary-btn">새 수업 등록</button>
</header>

<div class="main-layout">
  <!-- Sidebar with Mini Calendar -->
  <aside class="sidebar">
    <div class="mini-calendar">
      <div class="mini-calendar-header">
        <button id="prevMonth" class="nav-btn">&lt;</button>
        <span id="miniCalendarTitle">March 2026</span>
        <button id="nextMonth" class="nav-btn">&gt;</button>
      </div>
      <div class="mini-calendar-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div id="miniCalendarDays" class="mini-calendar-days">
        <!-- Days will be generated by JavaScript -->
      </div>
    </div>
  </aside>

  <!-- Main Schedule Area -->
  <div class="schedule-area">
    <!-- Week Navigation -->
    <div class="week-navigation">
      <button id="prevWeek" class="nav-btn">&lt;</button>
      <span id="weekTitle">March 2 - 8, 2026</span>
      <button id="nextWeek" class="nav-btn">&gt;</button>
      <button id="todayBtn" class="today-btn">Today</button>
    </div>

    <div id="scheduleGrid" class="grid-container">
      <!-- Header row -->
      <div class="grid-cell header">Time</div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Mon</div><div class="header-date">2</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Tue</div><div class="header-date">3</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Wed</div><div class="header-date">4</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Thu</div><div class="header-date">5</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Fri</div><div class="header-date">6</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Sat</div><div class="header-date">7</div></div></div>
      <div class="grid-cell header"><div style="text-align:center;"><div class="header-day">Sun</div><div class="header-date">8</div></div></div>

      <!-- 09:00 row -->
      <div class="grid-cell time-label">09:00</div>
      <div class="grid-cell task-cell color-yellow">윤서 (수업)</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>

      <!-- 10:00 row -->
      <div class="grid-cell time-label">10:00</div>
      <div class="grid-cell"></div>
      <div class="grid-cell task-cell color-blue">민준 (수업)</div>
      <div class="grid-cell"></div>
      <div class="grid-cell task-cell color-blue">민준 (수업)</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>

      <!-- 11:00 row -->
      <div class="grid-cell time-label">11:00</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell task-cell color-green">서연 (수업)</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>

      <!-- 12:00 row -->
      <div class="grid-cell time-label">12:00</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>

      <!-- 13:00 row -->
      <div class="grid-cell time-label">13:00</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
      <div class="grid-cell task-cell color-purple">지호 (수업)</div>
      <div class="grid-cell"></div>
      <div class="grid-cell"></div>
    </div>
  </div>
</div>

<!-- Modal: 전체 레이아웃의 최상단에 배치되는 컨테이너 -->
<div id="modal" class="modal-overlay">
  <div class="modal-content">
    <!-- Header: 제목과 제어 버튼 -->
    <div class="modal-header">
      <h3>새 수업 등록</h3>
      <button id="closeModalBtn" class="close-btn">&times;</button>
    </div>
    <!-- Body: 데이터 수집을 위한 입력 필드 집합 -->
    <div class="modal-body">
      <div class="form-group">
        <label for="studentName">학생 이름</label>
        <input type="text" id="studentName" placeholder="학생 이름을 입력하세요">
      </div>
      <div class="form-group">
        <label for="daySelect">요일</label>
        <select id="daySelect">
          <option value="mon">월요일</option>
          <option value="tue">화요일</option>
          <option value="wed">수요일</option>
          <option value="thu">목요일</option>
          <option value="fri">금요일</option>
          <option value="sat">토요일</option>
          <option value="sun">일요일</option>
        </select>
      </div>
      <div class="form-group">
        <label for="startTimeSelect">시작 시간</label>
        <input type="time" id="startTimeSelect">
      </div>
      <div class="form-group">
        <label for="endTimeSelect">종료 시간</label>
        <input type="time" id="endTimeSelect">
      </div>
    </div>
    <!-- Footer: 트랜잭션 확정 또는 취소 버튼 -->
    <div class="modal-footer">
      <button id="cancelBtn" class="secondary-btn">취소</button>
      <button id="submitBtn" class="primary-btn">등록</button>
    </div>
  </div>
</div>

<!-- Detail Modal: 수업 상세 보기/수정/삭제 -->
<div id="detailModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>수업 상세</h3>
      <button id="closeDetailModalBtn" class="close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="detail-info">
        <p><strong>학생 이름:</strong> <span id="detailStudentName"></span></p>
        <p><strong>날짜:</strong> <span id="detailDate"></span></p>
        <p><strong>시간:</strong> <span id="detailTime"></span></p>
      </div>
    </div>
    <div class="modal-footer">
      <button id="editBtn" class="primary-btn">수정</button>
      <button id="deleteBtn" class="danger-btn">삭제</button>
    </div>
  </div>
</div>

<!-- JavaScript file 과 연동 -->
<script src="script.js"></script>
</body>
</html>
